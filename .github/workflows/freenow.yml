name: FREENOW Abruf

on:
  schedule:
    # Täglich 21:50 UTC = 22:50 Uhr (Winter) bzw. 23:50 Uhr (Sommer) in Berlin
    - cron: "50 21 * * *"
  workflow_dispatch:
    inputs:
      monate:
        description: "Wie viele Monate laden? (2 = laufender + Vormonat, 6 = letztes halbes Jahr)"
        default: "2"
        required: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: CSV holen und an Google-Tabelle senden
        run: node abruf.js
        env:
          FREENOW_EMAIL: ${{ secrets.FREENOW_EMAIL }}
          FREENOW_PASSWORT: ${{ secrets.FREENOW_PASSWORT }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          MONATE: ${{ github.event.inputs.monate || '2' }}
      - name: CSV und Fehlerbild aufbewahren (7 Tage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freenow-ausgabe
          path: ausgabe/
          retention-days: 7
